<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil | Analog Dreams</title>

    <link rel="stylesheet" href="../css/principal.css">
</head>

<body>

    <nav>
        <h2>🎵 Analog Dreams</h2>

        <div>
            <a href="../index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="perfil.html">Meu perfil</a>
        </div>
    </nav>

    <main>

        <section>

            <h1>Meu Perfil</h1>

            <form id="formPerfil">

                <h2>Dados pessoais</h2>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>

                <br><br>

                <label for="sobreNome">Sobrenome:</label>
                <input type="text" id="sobreNome" required>

                <br><br>

                <label for="idade">Idade:</label>
                <input type="text" id="idade" required>

                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" required>

                <br><br>

                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" required>

                <br><br>

                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" required>

                <br><br>

                <h2>Endereço</h2>

                <label for="cep">CEP:</label>
                <input type="text" id="cep" required>

                <br><br>

                <label for="rua">Rua:</label>
                <input type="text" id="rua" required>

                <br><br>

                <label for="numero">Número:</label>
                <input type="text" id="numero" required>

                <br><br>

                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" required>

                <br><br>

                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" required>

                <br><br>

                <label for="estado">Estado:</label>
                <input type="text" id="estado" maxlength="2" required>

                <br><br>

                <button type="submit">Salvar alterações</button>

            </form>

        </section>

    </main>

    <footer>
        <p>🎵 Analog Dreams</p>
        <p>Sua loja de música física</p>
        <p>Desenvolvido por Clarice Heitmann</p>
    </footer>

    <script src="../js/perfil.js"></script>

</body>

</html>
