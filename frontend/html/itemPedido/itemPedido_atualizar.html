
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Item | Analog Dreams</title>
    <link rel="stylesheet" href="../../css/principal.css">
    <script src="../../js/itemPedido/itemPedido_atualizar.js" defer></script>
</head>
<body>

    <nav>
        <h2>Analog Dreams</h2>
        <div>
            <a href="../../index.html">Início</a>
        </div>
    </nav>

    <main>
        <section>
            <h1>Atualizar Item do Pedido</h1>

            <form id="formItem">

                <label for="codigo">Código do item:</label>
                <input type="number" id="codigo" min="1" required>

                <label for="quantidade">Nova quantidade:</label>
                <input type="number" id="quantidade" min="1" required>

                <button type="submit">Atualizar</button>

            </form>

            <p id="mensagem"></p>
        </section>
    </main>

    <footer>
        <p>Analog Dreams</p>
        <p>Sua loja de música física</p>
        <p>Desenvolvido por Clarice Heitmann</p>
    </footer>

</body>
</html>
