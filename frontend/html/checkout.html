
<!DOCTYPE html>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/checkout-historico.css">

    <script src="../js/checkout.js" defer></script>

<body>

    <header class="topo">
        <a href="../index.html" class="logo">
            <span class="logo-disco">♫</span>
            <span>Analog Dreams</span>
        </a>

        <nav class="menu">
            <a href="../index.html">Início</a>
            <a href="produto/produtos.html">Produtos</a>

        <a href="admin.html" class="admin-link">Área administrativa</a>

    <main class="pagina-pedido">

        <h1>Finalizar compra</h1>
        <p>Seu próximo disco favorito está quase chegando!</p>

        <div id="resumoCheckout"></div>

        <form id="formCheckout">

            <h2>Endereço de entrega ♫</h2>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" required>

            <label for="rua">Rua:</label>
            <input type="text" id="rua" required>

            <label for="numero">Número:</label>
            <input type="text" id="numero" required>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" required>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" required>

            <label for="estado">Estado:</label>
            <input type="text" id="estado" maxlength="2" required>

            <button type="submit">Confirmar pedido ♫</button>

        </form>

    </main>

    <footer>
        <h2>♫ Analog Dreams</h2>
