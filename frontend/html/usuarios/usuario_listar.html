
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listar usuários | Analog Dreams</title>
    <link rel="stylesheet" href="../../css/principal.css">
    <script src="../../js/usuarios/usuario_listar.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Usuários cadastrados</h1>

        <button type="button" id="btnListar">Carregar usuários</button>
        <p id="mensagem"></p>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nome</th>
                        <th>Sobrenome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>CPF</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios">
                    <tr>
                        <td colspan="6">Clique em "Carregar usuários".</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
