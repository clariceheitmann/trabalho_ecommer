
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Item | Analog Dreams</title>
    <link rel="stylesheet" href="../../css/principal.css">
    <script src="../../js/itemPedido/itemPedido_cadastrar.js" defer></script>
</head>
<body>

    <nav>
        <h2>Analog Dreams</h2>
        <div>
            <a href="../../index.html">Início</a>
        </div>
    </nav>

    <main>
        <section>

            <h1>Cadastrar Item do Pedido</h1>

            <form id="formItem">

                <label for="pedido_id">Pedido:</label>
                <select id="pedido_id" required>
                    <option value="">Selecione um pedido</option>
                </select>

                <label for="produto_id">Produto:</label>
                <select id="produto_id" required>
                    <option value="">Selecione um produto</option>
                </select>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" min="1" required>

                <button type="submit">Cadastrar</button>

            </form>

            <p id="mensagem"></p>

        </section>
    </main>

    <footer>
        <p>Analog Dreams</p>
        <p>Sua loja de música física</p>
        <p>Desenvolvido por Clarice Heitmann</p>
    </footer>

</body>
</html>
