
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir usuário | Analog Dreams</title>
    <link rel="stylesheet" href="../../css/principal.css">
    <script src="../../js/usuarios/usuario_excluir.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Excluir usuário</h1>

        <p>Informe o código do usuário que deseja excluir.</p>

        <form id="formExcluir">
            <label for="id">Código do usuário:</label>
            <input type="number" id="id" min="1" required>

            <button type="submit">Excluir usuário</button>
        </form>

        <p id="mensagem"></p>
    </main>
</body>
</html>
