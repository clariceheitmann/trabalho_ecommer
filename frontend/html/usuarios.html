
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar usuários | Analog Dreams</title>
    <link rel="stylesheet" href="../css/principal.css">
    <script src="../js/usuarios.js" defer></script>
</head>
<body>

    <main class="container">
        <h1>Gerenciar usuários</h1>
        <p>Consulte os usuários cadastrados na loja.</p>

        <section>
            <h2>Buscar usuário</h2>

            <label for="codigo">Código do usuário:</label>
            <input type="number" id="codigo" min="1">
            <button type="button" id="btnBuscarCodigo">
                Buscar por código
            </button>

            <br><br>

            <label for="nome">Nome do usuário:</label>
            <input type="text" id="nome">
            <button type="button" id="btnBuscarNome">
                Buscar por nome
            </button>

            <button type="button" id="btnListar">
                Listar todos
            </button>

            <p id="mensagem"></p>
        </section>

        <section>
            <h2>Usuários cadastrados</h2>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nome</th>
                            <th>Sobrenome</th>
                            <th>E-mail</th>
                            <th>Telefone</th>
                            <th>Tipo</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaUsuarios">
                        <tr>
                            <td colspan="7">
                                Clique em "Listar todos" para carregar os usuários.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

</body>
</html>
