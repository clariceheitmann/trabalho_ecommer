<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produto | Analog Dreams</title>

    <link rel="stylesheet" href="../css/principal.css">

</head>

<body>

    <nav>

        <h2>🎵 Analog Dreams</h2>

        <div>

            <a href="../index.html">Início</a>

            <a href="produtos.html">Produtos</a>

            <a href="admin.html">Administração</a>

        </div>

    </nav>


    <main>

        <section>

            <h1 id="tituloPagina">Cadastrar produto</h1>


            <form id="formProduto">

                <label for="nome">Nome do produto:</label>

                <input
                    type="text"
                    id="nome"
                    required
                >

                <br><br>


                <label for="artista">Artista:</label>

                <input
                    type="text"
                    id="artista"
                    required
                >

                <br><br>


                <label for="album">Álbum:</label>

                <input
                    type="text"
                    id="album"
                    required
                >

                <br><br>


                <label for="formato">Formato:</label>

                <select id="formato" required>

                    <option value="">Selecione</option>

                    <option value="VINIL">Vinil</option>

                    <option value="CD">CD</option>

                    <option value="CASSETE">Cassete</option>

                </select>

                <br><br>


                <label for="ano">Ano:</label>

                <input
                    type="number"
                    id="ano"
                    required
                >

                <br><br>


                <label for="preco">Preço:</label>

                <input
                    type="number"
                    id="preco"
                    step="0.01"
                    min="0"
                    required
                >

                <br><br>


                <label for="imagem">Imagem:</label>

                <input
                    type="text"
                    id="imagem"
                    placeholder="../img/nome-da-imagem.jpg"
                >

                <br><br>


                <label for="categoria_id">Categoria:</label>

                <input
                    type="number"
                    id="categoria_id"
                    required
                >

                <br><br>


                <button type="submit">
                    Salvar produto
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>🎵 Analog Dreams</p>

        <p>Sua loja de música física</p>

        <p>Desenvolvido por Clarice Heitmann</p>

    </footer>


    <script src="../js/produto-form.js"></script>

</body>

</html>
