
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar usuário | Analog Dreams</title>
    <link rel="stylesheet" href="../../css/principal.css">
    <script src="../../js/usuarios/usuario_atualizar.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Atualizar usuário</h1>

        <form id="formAtualizar">
            <label for="id">Código do usuário:</label>
            <input type="number" id="id" min="1" required>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="sobreNome">Sobrenome:</label>
            <input type="text" id="sobreNome" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" required>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" required>

            <label for="rua">Rua:</label>
            <input type="text" id="rua" required>

            <label for="numero">Número:</label>
            <input type="text" id="numero" required>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" required>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" required>

            <label for="estado">Estado (UF):</label>
            <input type="text" id="estado" maxlength="2" required>

            <button type="submit">Salvar alterações</button>
        </form>

        <p id="mensagem"></p>
    </main>
</body>
</html>
