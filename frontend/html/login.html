<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Loja de Música</title>

</head>

<body>

    <h1>Entrar</h1>

    <form id="formLogin">

        <div>
            <label for="email">E-mail:</label>

            <input
                type="email"
                id="email"
                required
            >
        </div>

        <br>

        <div>
            <label for="senha">Senha:</label>

            <input
                type="password"
                id="senha"
                required
            >
        </div>

        <br>

        <button type="submit">
            Entrar
        </button>

    </form>

    <script src="../js/login.js"></script>

</body>

</html>
