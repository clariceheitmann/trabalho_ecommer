<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Estoque | Analog Dreams</title>
    <link rel="stylesheet" href="../../css/principal.css">
    <script src="../js/estoque_atualizar.js" defer></script>
</head>
<body>

    <nav>
        <h2>Analog Dreams</h2>
        <div>
            <a href="../../index.html">Início</a>
            <a href="../../html/estoque.html">Estoque</a>
        </div>
    </nav>

    <main>
        <section>

            <h1>Atualizar Estoque</h1>

            <form id="formEstoque">

                <label for="estoque_id">Estoque:</label>
                <select id="estoque_id" required>
                    <option value="">Selecione um estoque</option>
                </select>

                <br><br>

                <label for="quantidade">Nova quantidade:</label>
                <input type="number" id="quantidade" min="0" required>

                <br><br>

                <button type="submit">Atualizar estoque</button>

            </form>

            <p id="mensagem"></p>

        </section>
    </main>

    <footer>
        <p>Analog Dreams</p>
        <p>Sua loja de música física</p>
        <p>Desenvolvido por Clarice Heitmann</p>
    </footer>

</body>
</html>
