
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualização parcial | Analog Dreams</title>
    <link rel="stylesheet" href="../../css/principal.css">
    <script src="../../js/usuarios/usuario_atualizar_parcial.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Atualização parcial de usuário</h1>
        <p>Informe o código e preencha somente os campos que deseja alterar.</p>

        <form id="formAtualizarParcial">
            <label for="id">Código do usuário:</label>
            <input type="number" id="id" min="1" required>

            <label for="nome">Nome:</label>
            <input type="text" id="nome">

            <label for="sobreNome">Sobrenome:</label>
            <input type="text" id="sobreNome">

            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1">

            <label for="email">E-mail:</label>
            <input type="email" id="email">

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone">

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf">

            <label for="cep">CEP:</label>
            <input type="text" id="cep">

            <label for="rua">Rua:</label>
            <input type="text" id="rua">

            <label for="numero">Número:</label>
            <input type="text" id="numero">

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro">

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade">

            <label for="estado">Estado (UF):</label>
            <input type="text" id="estado" maxlength="2">

            <button type="submit">Atualizar campos preenchidos</button>
        </form>

        <p id="mensagem"></p>
    </main>
</body>
</html>
