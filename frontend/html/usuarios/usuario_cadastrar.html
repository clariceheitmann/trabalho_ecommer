
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar usuário | Analog Dreams</title>
    <link rel="stylesheet" href="../../css/principal.css">
    <script src="../../js/usuarios/usuario_cadastrar.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Cadastrar usuário</h1>

        <form id="formCadastro">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" required>

            <label for="sobreNome">Sobrenome:</label>
            <input type="text" id="sobreNome" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="1" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" placeholder="00000-000" required>

            <label for="numero">Número do endereço:</label>
            <input type="text" id="numero" required>

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagem"></p>
        <a href="../login.html">Já tenho uma conta</a>
    </main>
</body>
</html>
