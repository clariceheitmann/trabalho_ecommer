<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Vinyl Dreams</title>

    <link rel="stylesheet" href="../css/principal.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <h2>🎵 Vinyl Dreams</h2>

        <div>
            <a href="../index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="login.html">Entrar</a>
        </div>
    </nav>


    <!-- Cadastro -->
    <main>

        <form id="formCadastro">

            <h1> criar conta</h1>

            <div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
            </div>

            <div>
                <label for="sobreNome">Sobrenome:</label>
                <input type="text" id="sobreNome" required>
            </div>

            <div>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" required>
            </div>

            <div>
                <label for="email">E-mail:</label>
                <input type="email" id="email" required>
            </div>

            <div>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
            </div>

            <div>
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" required>
            </div>

            <div>
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" maxlength="11" required>
            </div>

            <div>
                <label for="cep">CEP:</label>
                <input type="text" id="cep" maxlength="8" required>
            </div>

            <div>
                <label for="rua">Rua:</label>
                <input type="text" id="rua" required>
            </div>

            <div>
                <label for="numero">Número:</label>
                <input type="text" id="numero" required>
            </div>

            <div>
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" required>
            </div>

            <div>
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" required>
            </div>

            <div>
                <label for="estado">Estado:</label>
                <input type="text" id="estado" maxlength="2" required>
            </div>

            <button type="submit">Cadastrar</button>

        </form>

    </main>


    <!-- Footer -->
    <footer>
        <p>🎵 Vinyl Dreams</p>
        <p>Sua loja de música física</p>
        <p>Desenvolvido por Clarice Heitmann</p>
    </footer>


    <script src="../js/cadastro.js"></script>

</body>

</html>
