
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Entrega</title>
    <link rel="stylesheet" href="../../css/principal.css">
</head>
<body>
    <h1>Atualizar Entrega</h1>

    <form id="formEntrega">
        <label for="id">Código da entrega:</label>
        <input type="number" id="id" min="1" required>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" maxlength="255" required>

        <label for="codigo_rastreio">Código de rastreio:</label>
        <input type="text" id="codigo_rastreio" maxlength="50">

        <label for="status">Status:</label>
        <select id="status" required>
            <option value="AGUARDANDO_ENVIO">Aguardando envio</option>
            <option value="ENVIADO">Enviado</option>
            <option value="EM_TRANSITO">Em trânsito</option>
            <option value="ENTREGUE">Entregue</option>
        </select>

        <button type="submit">Atualizar</button>
    </form>

    <p id="mensagem"></p>

    <script src="../../js/entregas/entrega_atualizar.js"></script>
</body>
</html>
