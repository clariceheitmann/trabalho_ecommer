
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar categoria | Analog Dreams</title>
    <link rel="stylesheet" href="../../css/principal.css">
    <script src="../../js/categoria/categoria_atualizar.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Atualizar categoria</h1>

        <form id="formAtualizar">
            <label for="id">Código da categoria:</label>
            <input type="number" id="id" min="1" required>

            <label for="nome">Novo nome:</label>
            <input type="text" id="nome" maxlength="100" required>

            <label for="descricao">Nova descrição:</label>
            <textarea id="descricao" maxlength="255"></textarea>

            <button type="submit">Salvar alterações</button>
        </form>

        <p id="mensagem"></p>
    </main>
</body>
</html>
