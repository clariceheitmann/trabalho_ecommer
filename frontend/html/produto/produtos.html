<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos | Analog Dreams</title>

    <link rel="stylesheet" href="../../css/produtos.css">

    <script src="../../js/produto/produtos.js" defer></script>
</head>

<body>

    <header>

        <h1>Analog Dreams</h1>

        <nav>
            <a href="../index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="login.html">Login</a>
        </nav>

    </header>


    <main>


        <h2>Nossos produtos</h2>

        <div class="barra-busca">
            <input type="text" id="campoBusca" placeholder="Buscar por álbum ou artista...">
            <button type="button" id="btnBuscar">Buscar</button>
            <button type="button" id="btnLimparBusca">Limpar</button>
        </div>


        <div class="filtros-produtos">
            <label for="filtroFormato">Formato:</label>
            <select id="filtroFormato">
                <option value="">Todos os formatos</option>
                <option value="VINIL">Vinil</option>
                <option value="CD">CD</option>
                <option value="FITA CASSETE">Fita cassete</option>
            </select>

            <label for="filtroGenero">Gênero musical:</label>
            <select id="filtroGenero">
                <option value="">Todos os gêneros</option>
            </select>
        </div>


        <section id="listaProdutos" class="produtos-container"></section>


    </main>


    <!-- MODAL DO PRODUTO -->

    <div id="modalProduto" class="modal-produto">

        <div class="conteudo-modal">

            <button class="fechar-modal" onclick="fecharModal()">
                ×
            </button>

            <div id="detalhesProduto"></div>

        </div>

    </div>

</body>

</html>
